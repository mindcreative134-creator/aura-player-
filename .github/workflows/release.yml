name: Make release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build standard release with Gradle
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Build Play Store release with Gradle
        run: ./gradlew assemblePlaystoreRelease --stacktrace

      - name: Build F-Droid release with Gradle
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Get tag name
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "VERSION_TAG=$(basename $GITHUB_REF)" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Verify build output
        run: |
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          PLAYSTORE_RELEASE_DIR="app/build/outputs/apk/playstore/release"
          FDROID_RELEASE_DIR="app/build/outputs/apk/fdroid/release"
          
          if [ ! -d "$STANDARD_RELEASE_DIR" ]; then
            echo "Standard release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          
          if [ ! -d "$PLAYSTORE_RELEASE_DIR" ]; then
            echo "Play Store release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          
          if [ ! -d "$FDROID_RELEASE_DIR" ]; then
            echo "F-Droid release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          
          echo "Standard release APKs:"
          ls -lah "$STANDARD_RELEASE_DIR"
          echo "Play Store release APKs:"
          ls -lah "$PLAYSTORE_RELEASE_DIR"
          echo "F-Droid release APKs:"
          ls -lah "$FDROID_RELEASE_DIR"

      - name: Sign APKs
        run: |
          set -e
          STANDARD_RELEASE_DIR="app/build/outputs/apk/standard/release"
          PLAYSTORE_RELEASE_DIR="app/build/outputs/apk/playstore/release"
          FDROID_RELEASE_DIR="app/build/outputs/apk/fdroid/release"
          
          if [ -n "${{ secrets.SIGNING_KEYSTORE }}" ]; then
            echo "Custom signing keystore provided in secrets, signing APKs..."
            echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore
            
            find app/build/outputs/apk -name "*-unsigned.apk" -type f | while read -r apk; do
              signed_apk="${apk/-unsigned/}"
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "$signed_apk" \
                "$apk"
              rm -f "$apk"
            done
            
            find app/build/outputs/apk -name "*-release.apk" -type f | while read -r apk; do
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
                --ks release.keystore \
                --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
                --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                "$apk"
            done
            rm -f release.keystore
          else
            echo "No custom SIGNING_KEYSTORE secret provided. Using Gradle-signed release APKs directly."
            find app/build/outputs/apk -name "*-unsigned.apk" -type f | while read -r apk; do
              signed_apk="${apk/-unsigned/}"
              $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
                --ks "$HOME/.android/debug.keystore" \
                --ks-key-alias androiddebugkey \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "$signed_apk" \
                "$apk"
              rm -f "$apk"
            done
          fi

          echo "Verifying release APK signatures:"
          for apk in "$STANDARD_RELEASE_DIR"/app-standard-*-release.apk \
                     "$PLAYSTORE_RELEASE_DIR"/app-playstore-universal-release.apk \
                     "$FDROID_RELEASE_DIR"/app-fdroid-arm64-v8a-release.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $apk..."
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$apk" || true
            fi
          done

      - name: Copy build artifacts
        run: |
          set -euo pipefail
          
          # Standard flavor APKs
          standard_apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          for abi in "${standard_apks[@]}"; do
            src="app/build/outputs/apk/standard/release/app-standard-${abi}-release.apk"
            dst="AuraPlayer-${abi}-${VERSION_TAG}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed standard APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done
          
          # Play Store flavor APK (universal only)
          playstore_src="app/build/outputs/apk/playstore/release/app-playstore-universal-release.apk"
          playstore_dst="AuraPlayer-playstore-${VERSION_TAG}.apk"
          if [ ! -f "$playstore_src" ]; then
            echo "::error file=$playstore_src::Signed Play Store APK was not found"
            exit 1
          fi
          cp "$playstore_src" "$playstore_dst"
          playstore_checksum=$(sha256sum "$playstore_dst" | awk '{ print $1 }')
          echo "apk_playstore_sha256=$playstore_checksum" >> "$GITHUB_ENV"
          
          # F-Droid flavor APK (only arm64-v8a, same package name)
          fdroid_src="app/build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release.apk"
          fdroid_dst="AuraPlayer-fdroid-${VERSION_TAG}.apk"
          if [ ! -f "$fdroid_src" ]; then
            echo "::error file=$fdroid_src::Signed F-Droid APK was not found"
            exit 1
          fi
          cp "$fdroid_src" "$fdroid_dst"
          fdroid_checksum=$(sha256sum "$fdroid_dst" | awk '{ print $1 }')
          echo "apk_fdroid_sha256=$fdroid_checksum" >> "$GITHUB_ENV"
          
          ls -lah AuraPlayer-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Aura Player ${{ env.VERSION_TAG }}
          body: |
            ## ✨ Aura Player ${{ env.VERSION_TAG }}

            Welcome to the inaugural release of **Aura Player**! 🎬✨
            
            Aura Player is an ultra-fast, modern media player for Android featuring the **Obsidian & Carbon Design System**, cinema ambient lighting, hardware-accelerated 4K/60fps playback, and full offline privacy.

            ### 💎 Key Highlights
            - **Obsidian & Carbon UI**: Pure `#060709` deep obsidian with frosted carbon glassmorphism cards.
            - **Vibrant Aura Accents**: Electric Cyan (`#00E5FF`), Neon Violet (`#7C4DFF`), and Sunset Amber (`#FF9100`).
            - **Next-Gen Player Controls**: 72dp glowing hero play/pause, gesture meters, and synchronized lyric integration.
            - **All-in-One Audio Suite**: Background playback, world radio streaming, and visualizer.
            - **100% Offline & Private**: Zero trackers, zero analytics, scoped storage compliant.

            ---
            ### 🔐 Checksums (SHA-256)

            | Variant | Architecture | SHA-256 Checksum |
            | :--- | :--- | :--- |
            | **Universal** | All Devices | `${{ env.apk_universal_sha256 }}` |
            | **ARM64** | `arm64-v8a` | `${{ env.apk_arm64_v8a_sha256 }}` |
            | **ARMv7** | `armeabi-v7a` | `${{ env.apk_armeabi_v7a_sha256 }}` |
            | **x86_64** | `x86_64` | `${{ env.apk_x86_64_sha256 }}` |
            | **x86** | `x86` | `${{ env.apk_x86_sha256 }}` |
            | **Play Store** | Universal | `${{ env.apk_playstore_sha256 }}` |
            | **F-Droid** | `arm64-v8a` | `${{ env.apk_fdroid_sha256 }}` |

            ---
            *Built with Android Jetpack Compose & Media3*
          files: |
            AuraPlayer-universal-${{ env.VERSION_TAG }}.apk
            AuraPlayer-arm64-v8a-${{ env.VERSION_TAG }}.apk
            AuraPlayer-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            AuraPlayer-x86-${{ env.VERSION_TAG }}.apk
            AuraPlayer-x86_64-${{ env.VERSION_TAG }}.apk
            AuraPlayer-playstore-${{ env.VERSION_TAG }}.apk
            AuraPlayer-fdroid-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
